name: Release Build

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Install Frontend Dependencies
        run: npm ci

      - name: Build Tauri Binary
        run: npm run tauri:build -- --no-bundle

      - name: Create Portable Zip Package
        shell: pwsh
        run: |
          $releaseDir = "release-package"
          New-Item -ItemType Directory -Path $releaseDir -Force | Out-Null
          Copy-Item "src-tauri/target/release/NetSpeedX.exe" -Destination "$releaseDir/NetSpeedX.exe" -Force

          $readmeContent = @"
          ========================================================================
             NETSPEEDX - WINDOWS NETWORK MONITOR & TASKBAR SPEED METER (${{ github.ref_name }})
          ========================================================================

          Aplikasi pemantau kecepatan internet desktop Windows, meteran kecepatan
          taskbar (TrafficMonitor Style), dan pemutus internet aplikasi (Kill Switch).

          CARA MENGGUNAKAN (SANGAT MUDAH):
          --------------------------------
          1. Cukup KLIK GANDA file 'NetSpeedX.exe' untuk langsung menjalankan aplikasi!
          2. Kecepatan internet (Upload & Download) akan langsung muncul di taskbar
             sebelah kanan di samping jam.
          3. Klik ganda pada angka kecepatan di taskbar untuk membuka Dashboard utama.
          4. (Opsional) Untuk menggunakan fitur Blokir Internet Aplikasi & intip password Wi-Fi,
             klik kanan 'NetSpeedX.exe' lalu pilih 'Run as administrator'.

          FITUR UTAMA:
          ------------
          - Taskbar Speed Meter (Menempel di samping jam seperti TrafficMonitor)
          - Dynamic Taskbar Offset (Bisa disesuaikan untuk laptop & PC apa pun)
          - Multi-Vector Internet Kill Switch (Blokir internet Chrome, Steam, Game, dll)
          - Speed Test & Diagnostik Jaringan 1-Klik
          - Web Dashboard di browser PC / HP (http://localhost:9090)
          - Catatan Riwayat Kuota Offline di database lokal SQLite
          - Super Ringan (Hanya ~10 MB RAM, <0.3% CPU)

          Pengembang: Asafik Daroini
          Repository: https://github.com/Asafik/network-monitoring
          Lisensi: MIT License
          "@

          Set-Content -Path "$releaseDir/PANDUAN_CARA_PAKAI.txt" -Value $readmeContent -Encoding UTF8
          Compress-Archive -Path "$releaseDir/*" -DestinationPath "NetSpeedX-${{ github.ref_name }}-Portable-x64.zip" -Force

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: 'NetSpeedX ${{ github.ref_name }} (Official Portable Release)'
          body: |
            ## 🌐 NetSpeedX ${{ github.ref_name }} - Official Release
            
            Aplikasi pemantau jaringan desktop Windows modern, ultra-ringan (~10MB RAM), TrafficMonitor-style taskbar speed meter, dan pemutus internet aplikasi (Firewall Kill Switch).
            
            ### 🚀 Cara Pakai (Ekstrak & Langsung Jalan):
            1. Unduh file `NetSpeedX-${{ github.ref_name }}-Portable-x64.zip` di bawah.
            2. Ekstrak file zip ke folder mana pun di PC Anda.
            3. Klik ganda `NetSpeedX.exe` untuk langsung menjalankan aplikasi!
            
            ### ✨ Fitur Unggulan:
            - **Taskbar Speed Meter**: Menempel di samping jam taskbar Windows (Upload & Download).
            - **Dynamic Taskbar Offset**: Slider jarak posisi yang bisa disesuaikan untuk layar laptop & PC apa pun.
            - **Multi-Vector Kill Switch**: Blokir internet Chrome, Steam, Game Microsoft Store (UWP) secara instan.
            - **Speed Test & Diagnostik**: 1-Klik Ping, Jitter, DNS Benchmark, & Flush DNS Cache.
            - **Web Dashboard**: Monitoring via browser PC / HP (`http://localhost:9090`).
            - **100% Offline**: Data tersimpan aman di database SQLite lokal.
          files: |
            NetSpeedX-*-Portable-x64.zip
            src-tauri/target/release/NetSpeedX.exe
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
