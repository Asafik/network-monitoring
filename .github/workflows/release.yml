name: Release Build

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Install Frontend Dependencies
        run: npm ci

      - name: Build Tauri Binary
        run: npm run tauri:build -- --no-bundle

      - name: Create Portable Zip Package
        shell: pwsh
        run: |
          $releaseDir = "release-package"
          New-Item -ItemType Directory -Path $releaseDir -Force | Out-Null
          
          if (Test-Path "src-tauri/target/release/NetSpeedX.exe") {
            Copy-Item "src-tauri/target/release/NetSpeedX.exe" -Destination "$releaseDir/NetSpeedX.exe" -Force
          } elseif (Test-Path "src-tauri/target/release/netspeedx.exe") {
            Copy-Item "src-tauri/target/release/netspeedx.exe" -Destination "$releaseDir/NetSpeedX.exe" -Force
          }

          $readmeContent = @"
          ========================================================================
             NETSPEEDX - WINDOWS NETWORK MONITOR & TASKBAR SPEED METER (${{ github.ref_name }})
          ========================================================================

          Ultra-lightweight Windows Network Monitor with a Taskbar Speed Meter (TrafficMonitor Style),
          Internet Kill Switch, and Local Web Dashboard.

          QUICK START / CARA PAKAI:
          ------------------------
          1. Double-click 'NetSpeedX.exe' to run the app immediately!
             (Cukup klik 2x file 'NetSpeedX.exe' untuk langsung menjalankan aplikasi).
          2. Real-time speeds (Upload & Download) will appear docked right on your taskbar clock.
             (Meteran kecepatan akan langsung muncul di taskbar samping jam).
          3. Double-click the taskbar speed numbers to open the full dashboard.
             (Klik ganda pada meteran untuk membuka dashboard utama).
          4. (Optional) Run as Administrator for Firewall App Blocker & Wi-Fi password features.
             (Jalankan sebagai administrator untuk fitur firewall & intip password Wi-Fi).

          FEATURES:
          ---------
          - Taskbar Speed Meter (TrafficMonitor Style) with 3 Visual Themes
          - Dynamic Taskbar Offset Slider & Quick Presets
          - Multi-Vector Internet Kill Switch (Block Chrome, Steam, UWP Games, etc.)
          - 1-Click Speed Test & Network Diagnostics
          - Local Web Dashboard (http://localhost:9090)
          - Single Instance Protection (Windows Named Mutex)
          - Ultra-Lightweight (~10 MB RAM, <0.3% CPU)

          Author: Asafik Daroini
          Repository: https://github.com/Asafik/network-monitoring
          License: MIT License
          "@

          Set-Content -Path "$releaseDir/README_CARA_PAKAI.txt" -Value $readmeContent -Encoding UTF8
          Compress-Archive -Path "$releaseDir/*" -DestinationPath "NetSpeedX-${{ github.ref_name }}-Portable-x64.zip" -Force

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: 'NetSpeedX ${{ github.ref_name }} (Official Portable Release)'
          body: |
            ## 🌐 NetSpeedX ${{ github.ref_name }} - Official Portable Release
            
            Ultra-lightweight Windows desktop network monitor (~10MB RAM), TrafficMonitor-style taskbar speed meter, and multi-vector internet kill switch.
            
            ---
            
            ### ⚡ Download & Quick Start (Ekstrak & Langsung Jalan):
            1. Download **`NetSpeedX-${{ github.ref_name }}-Portable-x64.zip`** (or **`NetSpeedX.exe`**) below.
            2. Extract and double-click **`NetSpeedX.exe`** to launch!
            
            > **Note:** If Windows SmartScreen appears on first run, click **More info** ➡️ **Run anyway**.
            
            ---
            
            ### ✨ Highlights / Fitur Utama:
            - **📌 Taskbar Speed Meter**: Real-time Upload & Download speed next to Windows taskbar clock.
            - **🎨 3 Visual Themes**: Transparent (Taskbar Blend), Solid Dark (High Contrast), and Glassmorphism (Neon Glow).
            - **🎛️ Dynamic Taskbar Offset**: Slider & quick presets (200px, 280px, 410px) to prevent covering tray icons.
            - **🔒 Single Instance Lock**: Windows Named Mutex prevents duplicate windows.
            - **⛔ Multi-Vector Kill Switch**: 1-click internet cut for Desktop apps (.exe) and Microsoft Store games (UWP).
            - **🚀 Speed Test & Diagnostics**: 1-click gateway ping, jitter, DNS benchmark & flush DNS.
            - **📱 Local Web Dashboard**: Access live monitoring via browser at `http://localhost:9090`.
            - **🪶 Ultra-Lightweight**: Only **~10 MB RAM** and **<0.3% CPU** (Built with Rust + Tauri v2).
          files: |
            NetSpeedX-*-Portable-x64.zip
            release-package/NetSpeedX.exe
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
